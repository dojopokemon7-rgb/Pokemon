# =============================================================
# Dojo Collect — Nginx main config (replaces the Caddyfile; AGENTS.md RULE 14:
# the WHY comments below are load-bearing, do NOT strip).
#
# Layout (the whole ./infra/nginx dir is mounted read-only at /etc/nginx):
#   nginx.conf                 this file
#   snippets/http-*.conf       http{}-level settings (CF trust, gzip, logging, TLS, timeouts, limits)
#   snippets/proxy-common.conf proxy headers/timeouts, included in every proxying location
#   snippets/security-headers.conf, snippets/locations.conf   shared by prod + staging servers
#   templates/*.template       rendered by the official image's envsubst (only ${DOMAIN})
#                              into the WRITABLE /etc/nginx-run/conf.d (see scripts/start.sh)
#
# ORIGIN TLS: Cloudflare fronts this origin in SSL/TLS "Full (strict)" mode, so
# the origin serves a Cloudflare ORIGIN CERTIFICATE (./infra/cloudflare-origin,
# mounted at /etc/nginx/origin), NOT Let's Encrypt: once the firewall restricts
# 80/443 to Cloudflare ranges (docs/CLOUDFLARE_SETUP.md) ACME HTTP-01 cannot
# reach the origin. The cert files MUST exist BEFORE the container starts
# (scripts/start.sh fails loudly otherwise). We NEVER hardcode the origin IP.
#
# CLOUDFLARE TRUST: CF-Connecting-IP is authoritative ONLY because the Droplet
# firewall restricts 80/443 to Cloudflare ranges; see snippets/http-global.conf.
#
# M-1 REQUEST-BODY LIMIT: /api/cards/recognize buffers its whole JSON body in
# the Node app BEFORE it can authenticate, so oversized bodies are rejected HERE
# (snippets/locations.conf). Verify with scripts/verify-nginx.mjs.
# =============================================================
# Workers must run as `nginx`: the staging htpasswd is root:nginx 0640.
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    include /etc/nginx/snippets/http-*.conf;
    include /etc/nginx-run/conf.d/*.conf;
}
