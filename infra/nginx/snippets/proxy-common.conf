# Included INSIDE every proxying location (proxy_set_header is only inherited
# when a location sets none of its own, so each location includes this file).
proxy_http_version 1.1;
proxy_set_header Host $host;
# $remote_addr is the REAL visitor IP when the peer is Cloudflare (real_ip in
# http-global.conf). Deliberate difference from Caddy, which put the CF edge IP here.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Hard-coded: every origin request arrives over TLS.
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
# NO proxy_set_header for CF-Connecting-IP: nginx forwards unknown request
# headers unchanged, and re-setting it could blank the real Cloudflare header
# and break per-visitor rate limiting.

proxy_connect_timeout 10s;
# 330s = longest app route (api/cron/refresh-owned-prices maxDuration 300s) + 30s.
# api/cards/[id]/enrich and api/users/me/portfolio/refresh (maxDuration 60) fit too.
# Cloudflare itself cuts proxied requests at 100s (524); this only matters for
# direct/loopback callers such as the cron.
proxy_send_timeout 330s;
proxy_read_timeout 330s;
# Next sets large CSP + Set-Cookie headers.
proxy_buffer_size 16k;
proxy_buffers 8 16k;
# Buffer the whole request body BEFORE forwarding: the app never sees a partial
# oversized body (stricter than Caddy, which streamed and cut mid-way).
proxy_request_buffering on;
proxy_redirect off;
