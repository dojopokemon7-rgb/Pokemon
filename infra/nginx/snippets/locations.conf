# Locations shared by the prod and staging servers. The including server MUST
# define `set $upstream http://<service>:3000;` at server level. The URI is
# passed through untouched via $request_uri (variable proxy_pass with a URI part
# would otherwise be used verbatim).

# M-1 REQUEST-BODY LIMIT (load-bearing, do NOT strip). /api/cards/recognize
# buffers its whole JSON body in the Node app BEFORE it can authenticate (a 29MB
# image body is ~100MB peak memory per request), so oversized bodies are rejected
# HERE. 30,000,000 B sits just ABOVE the app's MAX_REQUEST_BYTES (29,010,603 B in
# src/app/api/cards/recognize/route.ts) so every legitimate max-size scan passes
# and the app's own 413 stays the precise guard. nginx answers 413 on the declared
# Content-Length before reading the body (Caddy streamed and cut mid-way).
# Matcher is case-insensitive like Caddy's path matcher (probed); a trailing
# slash does NOT match in either.
location ~* ^/api/cards/recognize$ {
    client_max_body_size 30000000;
    # No Better Auth session cookie => nothing legitimate exceeds a few KB (image
    # scans require a session; anonymous text is capped at 4096 chars): cap at 64KB.
    # client_max_body_size cannot take a variable, hence the internal re-dispatch.
    if ($recognize_anon) {
        rewrite ^ /__recognize_anon last;
    }
    set $target $upstream$request_uri;
    proxy_pass $target;
    include /etc/nginx/snippets/proxy-common.conf;
}

location = /__recognize_anon {
    internal;
    client_max_body_size 64000;
    set $target $upstream$request_uri;
    proxy_pass $target;
    include /etc/nginx/snippets/proxy-common.conf;
}

# Streaming CSV export (ReadableStream): pass through unbuffered.
location = /api/admin/grading-interest/export {
    proxy_buffering off;
    set $target $upstream$request_uri;
    proxy_pass $target;
    include /etc/nginx/snippets/proxy-common.conf;
}

location / {
    set $target $upstream$request_uri;
    proxy_pass $target;
    include /etc/nginx/snippets/proxy-common.conf;
}
