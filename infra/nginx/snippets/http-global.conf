# http{}-level settings. Plain conf (not a template): no envsubst here.

# ---- Cloudflare trust (replaces Caddy `servers { trusted_proxies static ... }`) ----
# Ranges fetched LIVE from https://www.cloudflare.com/ips-v4 and /ips-v6 on
# 2026-11-22. They MUST stay in sync with the ufw allow rules in
# docs/CLOUDFLARE_SETUP.md section 6 (re-fetch both together).
# With real_ip, $remote_addr becomes the real visitor IP when the TCP peer is a
# Cloudflare edge, and stays the peer IP otherwise. CF-Connecting-IP itself is
# forwarded to the app UNCHANGED (src/lib/utils/rate-limit.ts clientIp() reads
# it first); it is authoritative only because the firewall limits 80/443 to
# Cloudflare — without that lock a direct-to-origin caller could forge it.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# ---- Runtime upstream resolution ----
# Docker's embedded DNS. Used with a VARIABLE proxy_pass so the app container's
# IP is re-resolved after `docker compose up -d --build app` (a static
# upstream{} would keep the stale IP and 502) and nginx boots even if the app is
# down. Only exists on user-defined networks (compose default network is one).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# 1 = request carries NO Better Auth session cookie (anonymous). A forged cookie
# defeats this (the proxy cannot validate sessions) -> falls back to the 30MB cap.
map $http_cookie $recognize_anon {
    default 1;
    "~(?:^|;\s*)(?:__Secure-)?better-auth\.session_token=" 0;
}

# ---- Compression (probed against caddy:2-alpine `encode gzip`) ----
# Caddy gzips compressible text types only and only when the body is >512 B
# (512 not compressed, 513 compressed). nginx compresses when length >= min, so 513.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 513;
gzip_comp_level 5;
gzip_types text/plain text/css text/xml text/javascript application/javascript
           application/x-javascript application/json application/manifest+json
           application/xml application/xhtml+xml application/rss+xml
           application/atom+xml application/wasm image/svg+xml;

# ---- Logging (Caddy redacted Cookie/Authorization; we never log them at all) ----
# No Cookie, Authorization, request bodies or QUERY STRINGS (tokens/OTP links can
# ride in query strings): only the path part of the original request URI.
map $request_uri $log_path {
    ~^(?<p>[^?]*) $p;
    default       "-";
}
log_format dojo '$remote_addr [$time_local] $host "$request_method $log_path" '
                '$status $body_bytes_sent rt=$request_time up=$upstream_status';
access_log /dev/stdout dojo;

# ---- Timeouts / limits ----
client_header_timeout 20s;
client_body_timeout 120s;
keepalive_timeout 75s;
send_timeout 120s;
large_client_header_buffers 4 32k;
# Finite global cap (nginx default 1m would 413 /api/cards/recognize). 30,000,000 B
# = Caddy's recognize ceiling; the largest legit body is 29,010,603 B and every
# other POST route caps itself at <=16KB.
client_max_body_size 30000000;
client_body_temp_path /tmp/client_temp;

# ---- TLS (Mozilla "intermediate"; no OCSP stapling: origin cert has no OCSP) ----
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# ---- Container healthcheck ----
# Loopback inside the container only; compose publishes just 80/443, so this is
# unreachable from outside.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz {
        return 200 "ok\n";
    }
}
