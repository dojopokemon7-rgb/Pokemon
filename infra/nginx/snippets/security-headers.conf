# Proxy-level backstop headers, included at SERVER level only (an add_header in
# a nested location would drop this inherited set).
# Reproduces the Caddy `header { ... }` directive EXACTLY, as probed against
# caddy:2-alpine in front of a stub emitting the app's own headers: Caddy's
# `header` ADDS rather than replaces, so the client sees BOTH values
# (X-Frame-Options: SAMEORIGIN and DENY, two Referrer-Policy values, nosniff
# twice) and the app's Strict-Transport-Security passes through. nginx add_header
# also adds alongside upstream headers, so no proxy_hide_header is needed.
# Do NOT add HSTS/CSP/Permissions-Policy here (the app sets them).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
