# =============================================================
# TCG Collection PWA — Docker Compose
# Services: app | app-staging | redis | nginx (caddy = rollback profile)
# PostgreSQL is REMOTE (Supabase) — not managed here.
# =============================================================

services:
  # -----------------------------------------------------------
  # Redis 7 — Session cache, rate-limiting, OTP store
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tcg_redis
    restart: unless-stopped
    # Password-protected + persistent. REDIS_PASSWORD comes from .env.
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --loglevel warning
    ports:
      # Loopback-only: Redis is a private backing cache, never exposed on 0.0.0.0.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Next.js App — Built from ./Dockerfile
  # -----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are INLINED at `next build` (see Dockerfile), so they must
      # be passed as build args — the runtime env_file is too late for them.
      # Sourced from the root .env via compose ${VAR} substitution at --build time.
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_POSTHOG_DASHBOARD_URL: ${NEXT_PUBLIC_POSTHOG_DASHBOARD_URL:-}
    container_name: tcg_app
    restart: unless-stopped
    depends_on:
      # Redis is OPTIONAL (AGENTS.md RULE 1) — the app must start even if the
      # cache is down, so we wait for the container to START, not to be HEALTHY.
      redis:
        condition: service_started
    ports:
      # Loopback-only: the app is reached ONLY through Nginx (80/443). Binding to
      # 127.0.0.1 keeps port 3000 off the public internet so the reverse proxy is
      # the single entry point (no bypassing Nginx / its headers + TLS).
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    # S-3: bound the worst-case request buffering. Droplet = 2 vCPU/4GB shared by
    # prod app + staging app + redis + nginx: prod 1200m (heap 900 leaves headroom
    # for ~100MB transient 29MB-scan buffers + native/Buffer memory), staging 800m.
    # JUDGEMENT CALL: confirm against real RSS (docker stats) before deploying.
    mem_limit: 1200m
    environment:
      NODE_OPTIONS: --max-old-space-size=900
      # Override REDIS_URL to use the Docker service name + the shared password.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -----------------------------------------------------------
  # Next.js App — STAGING (staging.dojocollect.com)
  # Same image/build as `app`; isolated from prod by its own .env.staging and
  # a separate Postgres `staging` schema on the SAME Supabase DB (prod uses
  # `public`). SHARES the `redis` service with prod: Redis is cache-only and
  # optional (AGENTS.md RULE 1) and everything is reconstructable from
  # Postgres, so cross-env key overlap is cosmetic, not a correctness risk —
  # we accept that tradeoff instead of standing up a second Redis.
  # -----------------------------------------------------------
  app-staging:
    build:
      context: .
      dockerfile: Dockerfile
      # Same build-time inlining as prod `app`, but staging gets its OWN PostHog
      # project via STAGING_* vars so tester traffic never pollutes prod metrics.
      # Compose ${VAR} interpolation reads the ROOT .env only (not .env.staging,
      # and a runtime env_file is too late for NEXT_PUBLIC_* anyway), so the
      # STAGING_* vars live in the root .env. Unset = PostHog is a no-op on staging.
      args:
        NEXT_PUBLIC_POSTHOG_KEY: ${STAGING_NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${STAGING_NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_POSTHOG_DASHBOARD_URL: ${STAGING_NEXT_PUBLIC_POSTHOG_DASHBOARD_URL:-}
    container_name: tcg_app_staging
    restart: unless-stopped
    depends_on:
      # Mirror prod `app`: wait for redis to START (not HEALTHY) — the cache is
      # optional, the app must boot even if redis is down.
      redis:
        condition: service_started
    ports:
      # Loopback-only, DIFFERENT host port than prod (3000) to avoid a clash.
      # Reached ONLY through Nginx (staging.dojocollect.com). The container
      # itself still listens on 3000.
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.staging
    # S-3: staging memory ceiling (see prod app note); heap 600 < limit 800m.
    mem_limit: 800m
    environment:
      NODE_OPTIONS: --max-old-space-size=600
      # Same Docker-service Redis host; password comes from the shared .env.staging.
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -----------------------------------------------------------
  # Nginx — reverse proxy, TLS via Cloudflare Origin Certificate
  # (behind Cloudflare; ACME/Let's Encrypt not used — see infra/nginx/nginx.conf).
  # Replaces Caddy. Image pinned: nginx 1.30.7 (stable branch), alpine, OpenSSL 3.5.9,
  # checked 2026-11-22 (`nginx -V` in docs/NGINX_CUTOVER.md). No floating tags.
  #
  # The whole ./infra/nginx dir is mounted read-only at /etc/nginx, so a config
  # edit needs NO container recreate: `docker compose exec nginx nginx -t` then
  # `docker compose exec nginx nginx -s reload`. scripts/start.sh (entrypoint)
  # writes the staging htpasswd, then the official /docker-entrypoint.sh renders
  # templates/*.template (envsubst of ONLY ${DOMAIN}) into the writable
  # /etc/nginx-run/conf.d, which nginx.conf includes.
  #
  # ROLLBACK to Caddy (both proxies must NEVER run together: same 80/443):
  #   docker compose stop nginx && docker compose --profile caddy up -d caddy
  # `docker compose up -d` starts nginx and NOT caddy (caddy is in a profile).
  # -----------------------------------------------------------
  nginx:
    image: nginx:1.30.7-alpine
    container_name: tcg_nginx
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/nginx/scripts/start.sh"]
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      app:
        condition: service_started
      app-staging:
        condition: service_started
    # DOMAIN and STAGING_BASICAUTH_HASH use compose variable-substitution
    # (resolved from the root .env or the shell, NOT from an env_file). DOMAIN is
    # REQUIRED (no plain-HTTP dev mode as with Caddy; use `npm run dev` locally).
    # STAGING_BASICAUTH_HASH stays in the gitignored .env so `git reset --hard`
    # deploys never clobber it (see .env.example + docs/CLOUDFLARE_SETUP.md).
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN must be set for nginx}
      - STAGING_BASICAUTH_HASH=${STAGING_BASICAUTH_HASH}
      - NGINX_ENVSUBST_FILTER=DOMAIN
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx-run/conf.d
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx:/etc/nginx:ro
      # Cloudflare Origin Certificate (cert.pem + key.pem), pasted into
      # ./infra/cloudflare-origin on the Droplet (docs/CLOUDFLARE_SETUP.md). MUST be
      # in place BEFORE `docker compose up nginx` (start.sh fails loudly otherwise).
      # Git-ignored: never commit the key. Nested inside the read-only mount above;
      # infra/nginx/origin/.gitkeep provides the mountpoint.
      - ./infra/cloudflare-origin:/etc/nginx/origin:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
  # -----------------------------------------------------------
  # Caddy 2 — ROLLBACK ONLY (profile `caddy`; not started by `docker compose up`).
  # Superseded by nginx above. Use only via:
  #   docker compose stop nginx && docker compose --profile caddy up -d caddy
  # Never run together with nginx (same host ports 80/443).
  # Caddy 2 — reverse proxy, TLS via Cloudflare Origin Certificate
  # (behind Cloudflare; ACME/Let's Encrypt not used — see Caddyfile).
  # -----------------------------------------------------------
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    container_name: tcg_caddy
    restart: unless-stopped
    depends_on:
      - app
    # DOMAIN must be passed into the container: the Caddyfile reads {$DOMAIN}
    # from the container env, not from the host .env. Without this, DOMAIN is
    # empty, Caddy serves plain HTTP on :80 only, and never issues a TLS cert
    # (443 refuses). Keep DOMAIN unquoted in .env so the value isn't literal.
    #
    # Both values use compose variable-substitution (${VAR}), which compose
    # resolves from the project's default env file (.env in this directory) or
    # the shell — NOT from any service's `env_file`. The shared caddy service has
    # no `env_file`, so ${DOMAIN} and ${STAGING_BASICAUTH_HASH} BOTH come from the
    # root .env the same proven way. STAGING_BASICAUTH_HASH carries the staging
    # basic-auth bcrypt hash the Caddyfile reads as {$STAGING_BASICAUTH_HASH};
    # keeping it in the gitignored .env means `git reset --hard` deploys no longer
    # clobber it. (See .env.example + docs/CLOUDFLARE_SETUP.md.)
    environment:
      - DOMAIN=${DOMAIN}
      - STAGING_BASICAUTH_HASH=${STAGING_BASICAUTH_HASH}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare Origin Certificate (cert.pem + key.pem). The operator pastes
      # the Cloudflare-issued cert+key into ./infra/cloudflare-origin on the
      # Droplet (see docs/CLOUDFLARE_SETUP.md); the Caddyfile serves them via
      # `tls /etc/caddy/origin/cert.pem /etc/caddy/origin/key.pem`. The files
      # MUST be in place BEFORE `docker compose up caddy`. The directory + the
      # private key are git-ignored (.gitignore) — never commit the key.
      - ./infra/cloudflare-origin:/etc/caddy/origin:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
