<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0D0D0D" />
  <title>Dojo — You're Offline</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0D0D0D;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 32px;
      text-align: center;
      box-sizing: border-box;
    }

    .mark {
      width: 56px;
      height: 56px;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #E9B43B;
      margin: 0 0 12px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.6);
      max-width: 320px;
      margin: 0 0 28px;
    }

    button {
      background: #FFD52E;
      color: #0D0D0D;
      border: none;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 14px 28px;
      cursor: pointer;
      box-shadow: 5px 5px 0 0 #806A17;
    }

    button:active {
      transform: translate(5px, 5px);
      box-shadow: 0 0 0 0 #806A17;
    }
  </style>
</head>
